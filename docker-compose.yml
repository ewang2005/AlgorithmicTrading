networks:
  AlgoTrading:
    driver: bridge

services:
  # REDPANDA NODE 1
  redpanda-1:
    image: docker.redpanda.com/redpandadata/redpanda:v23.1.8
    container_name: redpanda-1
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - '1'
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda-1:29092,OUTSIDE://localhost:9092
      - --pandaproxy-addr
      - PLAINTEXT://0.0.0.0:28082,OUTSIDE://0.0.0.0:8082
      - --advertise-pandaproxy-addr
      - PLAINTEXT://redpanda-1:28082,OUTSIDE://localhost:8082
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - redpanda-1:33145
    ports:
      - 8082:8082
      - 9092:9092
      - 28082:28082
      - 29092:29092
    networks:
      - AlgoTrading

  # REDPANDA NODE 2
  redpanda-2:
    image: docker.redpanda.com/redpandadata/redpanda:v23.1.8
    container_name: redpanda-2
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - '2'
      - --seeds
      - redpanda-1:33145
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29093,OUTSIDE://0.0.0.0:9093
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda-2:29093,OUTSIDE://localhost:9093
      - --pandaproxy-addr
      - PLAINTEXT://0.0.0.0:28083,OUTSIDE://0.0.0.0:8083
      - --advertise-pandaproxy-addr
      - PLAINTEXT://redpanda-2:28083,OUTSIDE://localhost:8083
      - --rpc-addr
      - 0.0.0.0:33146
      - --advertise-rpc-addr
      - redpanda-2:33146
    ports:
      - 8083:8083
      - 9093:9093
      - 28083:28083
      - 29093:29093
    depends_on:
      - redpanda-1
    networks:
      - AlgoTrading

  # REDPANDA CONSOLE
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.2.4
    container_name: redpanda-console
    entrypoint: /bin/sh
    command: -c "echo \"$$CONSOLE_CONFIG_FILE\" > /tmp/config.yml; /app/console"
    ports:
      - 8080:8080
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda-1:29092", "redpanda-2:29093"]
    depends_on:
      - redpanda-1
      - redpanda-2
    networks:
      - AlgoTrading

# FLINK JOBMANAGER
  jobmanager:
    build: ./flink      
    container_name: jobmanager
    ports:
      - 8081:8081
    command: jobmanager  
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
    networks:
      - AlgoTrading

  # FLINK TASKMANAGER
  taskmanager:
    build: ./flink
    container_name: taskmanager
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
    networks:
      - AlgoTrading

  # FLINK SQL-CLIENT
  sql-client:
    build: ./flink
    container_name: sql-client
    depends_on:
      - jobmanager
    command: bash -c "sleep 15 && /opt/flink/bin/sql-client.sh -f /opt/flink/sql/init.sql"
    volumes:
      - ./flink/init.sql:/opt/flink/sql/init.sql
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        rest.address: jobmanager
    networks:
      - AlgoTrading
  
  # PORT PRODUCER
  producer:
    build: ./producer
    container_name: producer
    depends_on:
      - redpanda-1
      - redpanda-2
    env_file:
      - .env
    environment:
      BOOTSTRAP_SERVERS: redpanda-1:29092,redpanda-2:29093
    networks:
      - AlgoTrading
  
  # CANDLE CONSUMER
  consumer:
    build: ./consumer
    container_name: consumer
    depends_on:
      - redpanda-1
      - redpanda-2
    env_file:
      - .env
    environment:
      BOOTSTRAP_SERVERS: redpanda-1:29092,redpanda-2:29093
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
    networks:
      - AlgoTrading